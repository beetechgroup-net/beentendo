# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:beetendo}

# JPA/Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Scheduler interval configuration (mapped to SCRAPING_INTERVAL)
scraping.interval=${SCRAPING_INTERVAL:3h}

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ALLOWED_URL}
quarkus.http.cors.headers=accept, authorization, content-type, origin
quarkus.http.cors.methods=GET, POST, OPTIONS
